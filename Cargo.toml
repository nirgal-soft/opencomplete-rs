[package]
name = "opencomplete-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["ws"] }
base64 = "0.22.1"
clap = { version = "4.5.53", features = ["derive"] }
directories = "6.0.0"
futures = "0.3.31"
open = "5.3.3"
rand = "0.9.2"
reqwest = {version = "0.11.22", features = ["json", "stream"]}
serde = "1.0.228"
serde_json = "1.0.148"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
toml = "0.9.10"
tower-http = { version = "0.6.8", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
urlencoding = "2.1.3"
ws = "0.9.2"

[dev-dependencies]
tokio-test = "0.4.4"
